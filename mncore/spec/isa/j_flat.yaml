cycle_addr:
  desc: "4 サイクル分のアドレス欄（cycle0..3 の順）。flat では各サイクルのアドレスを直接持つ（単語単位）。"
  ref: ["Scrapbox 機械語「flat PEアドレスの位置」", "SDM 3.6.1.6"]
  rfc0_w: [pe_rfc0_wadr, pe_rfc0_wadr_c1, pe_rfc0_wadr_c2, pe_rfc0_wadr_c3]
  rfc0_r: [pe_rfc0_radr, pe_rfc0_radr_c1, pe_rfc0_radr_c2, pe_rfc0_radr_c3]
  rfc1_w: [pe_rfc1_wadr, pe_rfc1_wadr_c1, pe_rfc1_wadr_c2, pe_rfc1_wadr_c3]
  rfc1_r: [pe_rfc1_radr, pe_rfc1_radr_c1, pe_rfc1_radr_c2, pe_rfc1_radr_c3]
  lm0: [pe_lm0_adr, pe_lm0_adr_c1, pe_lm0_adr_c2, pe_lm0_adr_c3]
  lm1: [pe_lm1_adr, pe_lm1_adr_c1, pe_lm1_adr_c2, pe_lm1_adr_c3]
imm_layout:
  desc: "aluop=11111（imm / immu）のとき、32bit の即値ペイロードは専用の欄を持たず、ALUC と LM0 の欄を再利用する。各区間で、ペイロードの上位 bit が小さい pos に入る。"
  ref: ["SDM 3.6.12.3", "Scrapbox 機械語「即値32ビットとimmu」"]
  when: {field: "pe_aluc_aluop", val: "11111"}
  unsigned_flag: "pe_aluc_is_unsigned"
  segments:
    - {bits: [31, 30], pos: [145, 146], fields: [pe_aluc_dmode]}
    - {bits: [29, 28], pos: [153, 154], fields: [pe_aluc_rounda, pe_aluc_roundb]}
    - {bits: [27, 24], pos: [155, 158], fields: [pe_aluc_isela]}
    - {bits: [23, 21], pos: [159, 161], fields: [pe_aluc_iselb]}
    - {bits: [20, 18], pos: [75, 77], fields: [pe_lm0_write, pe_lm0_isel]}
    - {bits: [17, 12], pos: [90, 95], fields: [pe_lm0_tregadr, pe_lm0_maadj, pe_lm0_madpe, pe_lm0_wl]}
    - {bits: [11, 0], pos: [78, 89], fields: [pe_lm0_adr], replicas: [[282, 293], [342, 353], [402, 413]]}
  notes: "is_unsigned=0（imm）は 4 単語に x,x,x,x、1（immu）は x,0,x,0 を書く（Scrapbox）。半精度リテラルは同じ半語を 2 つ並べた 32bit になる。replicas は cycle1〜3 の LM0 アドレス欄（pe_lm0_adr_c1..c3）への複製で、assemble3 は常に同じ値を書く。imm の語では LM0 は使えない（assemble3: 'immop can't output to LM0'、同じ語の他の命令式が LM0 を使うと 'field conflict between immediate and lm0'）。したがって imm の語の pe_lm0_* は LM0 の制御として解釈しない。"
