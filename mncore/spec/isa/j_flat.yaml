# MN-Core 2 PE 命令語 flat 形式（j 行、426bit）のフィールド定義。WP01 が管理する。
#
# 出所: assemble3 --instruction-mode flat --disable-packer --print-csv（judge 同梱の 2024 年配布版、revision e0d90436755d1303e5577ea6e17c6611ab88f300）。
#   j 行の CSV は 110 列あり、列を順に連結すると j 語にビット単位で一致する。
#   CSV のヘッダ（95 名）は auto_stride（i 語、292bit）の並びで、flat の j 行とは列の数も順序も違う。
#   各列の名前は、両モードで受理されたコーパスの 7,843 語で auto_stride の名前付き列と値が全語一致することと、プローブで決めた。
#   cycle1〜3 のアドレス欄（csv_name: null）と rsv_* は flat にしかない。
# 参照: Scrapbox https://scrapbox.io/mncore/機械語 （観測の記録）、SDM（third_party/mncore/docs/mncore_llm、節番号で参照）。
#
# 規約（契約 06-contracts.md §2）
#   - pos: 'j ' に続くビット列の左端を 0 とする。Verilog では input [425:0] jw とし、jw[425-pos] が pos。
#   - フィールド値は左端（小さい pos）が MSB。値 v の bit k は pos + width - 1 - k にある。
#   - name: CSV 名の '.' と '/' を '_' にしたもの。cycle1〜3 のアドレス欄は cycle0 の名前に _c1/_c2/_c3 を付ける。
#     ただし CSV で同名の 2 列（l1bm.mabadr/opcode）は、エミュレータの解釈に合わせて l1bm_mabadr と l1bm_opcode に分けた。
#   - enum の val は width 桁の 2 進文字列。enum_when があれば、その条件が成り立つ語でだけ enum が意味を持つ。
#     imm_layout の欄は imm の語（aluop=11111）では即値ペイロードで、enum は当てはまらない。
#   - group: ll / mrc / trc / rfc0 / rfc1 / lm0 / lm1 / mauc / aluc / rsv / l1bm / l2bm / wd / addr_c1..3
#   - addr: アドレス欄の印（unit: rfc0/rfc1/lm0/lm1、port: w/r/rw、cycle: 0..3）。
# 意味が未確定の欄は UNKNOWN.md にまとめた。

schema: mnisa-1
kind: j
width: 426
assembler: "assemble3 2024-08-26 (judge v20240826) revision e0d90436755d1303e5577ea6e17c6611ab88f300"
references:
  scrapbox: "https://scrapbox.io/mncore/機械語"
  sdm: "third_party/mncore/docs/mncore_llm"
groups:
  ll: "命令語先頭の制御（nop / noforward）"
  mrc: "マスク制御（書き込みマスク、ゼロフラッシュ、$omr）"
  trc: "T レジスタの書き込み"
  rfc0: "GRF0 の制御と cycle0 アドレス"
  rfc1: "GRF1 の制御と cycle0 アドレス"
  lm0: "LM0 の制御と cycle0 アドレス"
  lm1: "LM1 の制御と cycle0 アドレス"
  mauc: "MAU（積和演算器）と行列レジスタの制御"
  aluc: "ALU の制御"
  rsv: "予約（flat だけにある 4bit）"
  l1bm: "L1BM 命令式（PE⇔L1BM、L2BM→L1BM の書き込み側）"
  l2bm: "L2BM 命令式（L1BM⇔L2BM、DAR）"
  wd: "wait（MV 命令の完了待ち）"
  addr_c1: "cycle1 の PE アドレス"
  addr_c2: "cycle2 の PE アドレス"
  addr_c3: "cycle3 の PE アドレス"
fields:
  - name: ll
    pos: 0
    width: 2
    group: ll
    csv_col: 0
    csv_name: "ll"
    desc: "命令語の先頭 2bit。語全体の実行形態を決める。nop だけの語は 00、通常は 01、noforward を含む語は 11。"
    ref: ["SDM 3.6.5", "SDM 3.6.6"]
    enum:
      - {val: "00", name: nop, desc: "nop。エミュレータは他の欄に何が入っていても書き込みもフォワーディングの更新もしない"}
      - {val: "01", name: normal, desc: "通常の PE 命令語（assemble3 既定の --ll-mode cold）"}
      - {val: "10", name: invalid, desc: "エミュレータが不正値として停止する（inst.ll == undefined）"}
      - {val: "11", name: noforward, desc: "書き込みは行うが、フォワーディングレジスタと $lbi を更新しない。assemble3 --ll-mode hot も 11 を出す"}
    notes: "エミュレータで確認: ipassa $lr2 $lr16 の ll を 11 にすると $lr16 は書かれ $aluf は更新されない。00 にすると $lr16 も書かれない。10 は停止。assemble3 の --ll-mode（cold=01 / hot=11 / mix）が実機で何を意味するかは未確認（UNKNOWN.md）。"
  - name: pe_mrc_imr
    pos: 2
    width: 5
    group: mrc
    csv_col: 1
    csv_name: "pe.mrc.imr"
    desc: "書き込みマスクの選択。1xxxx は直接指定（/xxxx の 4bit）、0nnnn はマスクレジスタ $imr<n>（n=1..15）、00000 はマスクなし。"
    ref: ["SDM 3.6.2", "SDM 3.6.2.1", "SDM 3.6.2.2", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
    notes: "書き込み先の /マスク（target_*）とオペコード側の /マスク（zero）で同じ欄を使う。"
  - name: pe_mrc_wl
    pos: 7
    width: 1
    group: mrc
    csv_col: 2
    csv_name: "pe.mrc.wl"
    desc: "マスクの語長。1 は 2 長語マスク（/ll0101 など）。"
    ref: ["SDM 3.6.2"]
    enum:
      - {val: "0", name: long, desc: "長語単位のマスク"}
      - {val: "1", name: dlong, desc: "2 長語単位のマスク（/ll…）"}
  - name: pe_mrc_target_rf0
    pos: 8
    width: 1
    group: mrc
    csv_col: 3
    csv_name: "pe.mrc.target_rf0"
    desc: "書き込みマスク imr を GRF0（$lr）への書き込みに適用する。"
    ref: ["SDM 3.6.2.1", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
  - name: pe_mrc_target_rf1
    pos: 9
    width: 1
    group: mrc
    csv_col: 4
    csv_name: "pe.mrc.target_rf1"
    desc: "書き込みマスク imr を GRF1（$ls）への書き込みに適用する。"
    ref: ["SDM 3.6.2.1", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
  - name: pe_mrc_target_tr
    pos: 10
    width: 1
    group: mrc
    csv_col: 5
    csv_name: "pe.mrc.target_tr"
    desc: "書き込みマスク imr を T レジスタ（$t）への書き込みに適用する。"
    ref: ["SDM 3.6.2.1", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
  - name: pe_mrc_target_lm0
    pos: 11
    width: 1
    group: mrc
    csv_col: 6
    csv_name: "pe.mrc.target_lm0"
    desc: "書き込みマスク imr を LM0（$lm）への書き込みに適用する。"
    ref: ["SDM 3.6.2.1", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
  - name: pe_mrc_target_lm1
    pos: 12
    width: 1
    group: mrc
    csv_col: 7
    csv_name: "pe.mrc.target_lm1"
    desc: "書き込みマスク imr を LM1（$ln）への書き込みに適用する。"
    ref: ["SDM 3.6.2.1", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
  - name: pe_mrc_target_mr
    pos: 13
    width: 1
    group: mrc
    csv_col: 8
    csv_name: "pe.mrc.target_mr"
    desc: "書き込みマスク imr を マスクレジスタ（$omr）への書き込みに適用する。"
    ref: ["SDM 3.6.2.1", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
  - name: pe_mrc_zero
    pos: 14
    width: 1
    group: mrc
    csv_col: 9
    csv_name: "pe.mrc.zero"
    desc: "ゼロフラッシュマスクを有効にする（オペコード側の /マスク。例: lpassa/0101）。マスクは imr。"
    ref: ["SDM 3.6.2.2", "Scrapbox 機械語「書き込みマスクとゼロフラッシュ」"]
  - name: pe_mrc_zero_sel
    pos: 15
    width: 2
    group: mrc
    csv_col: 10
    csv_name: "pe.mrc.zero_sel"
    desc: "ゼロフラッシュを適用する演算器の出力。符号は isel と同じ（00 MAU、01 ALU、10 L1BM、11 行列読み出し）。"
    ref: ["SDM 3.6.2.2"]
    enum:
      - {val: "00", name: mau, desc: "MAU の演算結果"}
      - {val: "01", name: alu, desc: "ALU の演算結果"}
      - {val: "10", name: l1bm, desc: "L1BM→PE 転送のデータ"}
      - {val: "11", name: mread, desc: "行列レジスタの読み出し（転置読み出し）"}
    notes: "プローブ: fvadd/0101 → 00、lpassa/0101 → 01、l1bmd/0101・l1bmp/0101 → 10、dmread/0101 → 11。異なる演算器に別々の /マスクを付けると assemble3 は拒否する（conflict mr zero_sel）。"
  - name: pe_mrc_omr
    pos: 17
    width: 4
    group: mrc
    csv_col: 11
    csv_name: "pe.mrc.omr"
    desc: "書き込むマスクレジスタの番号（出力 $omr<n>、n=1..15）。0 は書かない。"
    ref: ["SDM 3.6.1.13", "SDM 3.6.12.1", "SDM 3.6.9.26"]
  - name: pe_mrc_ifsel
    pos: 21
    width: 1
    group: mrc
    csv_col: 12
    csv_name: "pe.mrc.ifsel"
    desc: "$omr に書くフラグの出所。0 は ALU 命令式、1 は MAU 命令式。"
    ref: ["SDM 3.6.12.1", "SDM 3.6.9.26"]
    enum:
      - {val: "0", name: alu, desc: "ALU 命令式のフラグ"}
      - {val: "1", name: mau, desc: "MAU 命令式のフラグ"}
    notes: "コーパスの命令行を 1 行ずつアセンブルして、$omr に書く 471 行すべてで「MAU 命令式が書くなら 1」が成り立つ。同じ語で ALU と MAU の両方から $omr へ書くと assemble3 は拒否する（out_maskreg の衝突）。"
  - name: pe_trc_write
    pos: 22
    width: 1
    group: trc
    csv_col: 13
    csv_name: "pe.trc.write"
    desc: "T レジスタへの書き込みを有効にする。"
    ref: ["SDM 3.6.1.12"]
  - name: pe_trc_isel
    pos: 23
    width: 2
    group: trc
    csv_col: 14
    csv_name: "pe.trc.isel"
    desc: "T レジスタに書くデータの選択。"
    ref: ["SDM 3.6.1.12", "Scrapbox 機械語「ALU結果の出力先」"]
    enum:
      - {val: "00", name: mau, desc: "MAU の演算結果"}
      - {val: "01", name: alu, desc: "ALU の演算結果"}
      - {val: "10", name: l1bm, desc: "L1BM→PE 転送のデータ"}
      - {val: "11", name: mread, desc: "行列レジスタの読み出し（転置読み出し）"}
  - name: pe_rfc0_write
