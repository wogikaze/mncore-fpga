    width: 9
    group: rfc0
    csv_col: 20
    csv_name: "pe.rfc0.radr"
    addr: {unit: rfc0, port: r, cycle: 0}
    desc: "cycle0 の読み出しアドレス（単語単位、0..511）。"
    ref: ["SDM 3.6.1.10", "Scrapbox 機械語「flat PEアドレスの位置」"]
  - name: pe_rfc1_write
