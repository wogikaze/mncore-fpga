    width: 1
    group: rfc0
    csv_col: 15
    csv_name: "pe.rfc0.write"
    desc: "GRF0（$lr / $r / $llr） への書き込みを有効にする。"
    ref: ["SDM 3.6.1.10"]
  - name: pe_rfc0_isel
    pos: 26
