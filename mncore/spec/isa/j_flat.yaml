    group: rfc0
    csv_col: 16
    csv_name: "pe.rfc0.isel"
    desc: "GRF0（$lr / $r / $llr） に書くデータの選択。"
    ref: ["SDM 3.6.1.10", "Scrapbox 機械語「ALU結果の出力先」"]
    enum:
