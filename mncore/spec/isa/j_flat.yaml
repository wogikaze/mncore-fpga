    width: 1
    group: rfc1
    csv_col: 21
    csv_name: "pe.rfc1.write"
    desc: "GRF1（$ls / $s / $lls） への書き込みを有効にする。"
    ref: ["SDM 3.6.1.11"]
  - name: pe_rfc1_isel
    pos: 51
    width: 2
    group: rfc1
    csv_col: 22
    csv_name: "pe.rfc1.isel"
    desc: "GRF1（$ls / $s / $lls） に書くデータの選択。"
    ref: ["SDM 3.6.1.11", "Scrapbox 機械語「ALU結果の出力先」"]
    enum:
