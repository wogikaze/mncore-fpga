      - {val: "10", name: l1bm, desc: "L1BM→PE 転送のデータ"}
      - {val: "11", name: mread, desc: "行列レジスタの読み出し（転置読み出し）"}
  - name: pe_rfc0_wadr
    pos: 28
    width: 9
    group: rfc0
    csv_col: 17
    csv_name: "pe.rfc0.wadr"
    addr: {unit: rfc0, port: w, cycle: 0}
    desc: "cycle0 の書き込みアドレス（単語単位、0..511）。"
    ref: ["SDM 3.6.1.10", "Scrapbox 機械語「flat PEアドレスの位置」"]
    notes: "auto_stride の wadr と違い、flat では単語単位。書き込みがない語でも値が入ることがある（assemble3 は未使用のアドレス欄にも値を置く）。"
  - name: pe_rfc0_wwl
    pos: 37
    width: 2
    group: rfc0
    csv_col: 18
    csv_name: "pe.rfc0.wwl"
    desc: "書き込みの語長。"
    ref: ["SDM 3.6.1.10", "SDM 1.3"]
    enum:
      - {val: "00", name: word, desc: "単語（32bit）"}
      - {val: "01", name: long, desc: "長語（64bit）"}
      - {val: "10", name: dlong, desc: "2 長語（128bit）"}
    notes: "CSV ヘッダ（auto_stride 順）では wadri の後にある。flat の j 行では wadr の直後で、rwl・radr が続く。"
  - name: pe_rfc0_rwl
    pos: 39
    width: 2
    group: rfc0
    csv_col: 19
    csv_name: "pe.rfc0.rwl"
    desc: "読み出しの語長。"
    ref: ["SDM 3.6.1.10", "SDM 1.3"]
    enum:
      - {val: "00", name: word, desc: "単語（32bit）"}
      - {val: "01", name: long, desc: "長語（64bit）"}
      - {val: "10", name: dlong, desc: "2 長語（128bit）"}
